<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>DOM Assignment</title>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center px-4">
            <div class="w-full max-w-sm sm:max-w-md md:max-w-2xl border border-blue-500 rounded-md p-4 sm:p-6 shadow-lg shadow-blue-500/10 flex flex-col items-center gap-4">
            <h1 class="text-xl sm:text-2xl md:text-3xl font-bold text-center">List of Continents</h1>
            <p class="text-sm sm:text-base text-center">There are 7 continents in the world. 3 are already listed below, input the remaining 4... </p>
            <ol id="continentList" class="list-decimal list-outside space-y-2 w-full sm:w-3/4 md:w-2/3 px-2 sm:px-4 md:px-6">
                <li>
                    <div class="flex item-center justify-between">
                        <span>Australia (sometimes called Oceania)</span>
                        <button class="ml-3 border border-red-600 rounded-md px-1 cursor-pointer" style="height: 26px;"><ion-icon name="close" class="text-2xl text-red-600"></ion-icon></button>
                    </div>
                </li>
                <li>
                    <div class="flex item-center justify-between">
                        <span>North America</span>
                        <button class="ml-3 border border-red-600 rounded-md px-1 cursor-pointer" style="height: 26px;"><ion-icon name="close" class="text-2xl text-red-600"></ion-icon></button>
                    </div>
                </li>
                <li>
                    <div class="flex item-center justify-between">
                        <span>Africa</span>
                        <button class="ml-3 border border-red-600 rounded-md px-1 cursor-pointer" style="height: 26px;"><ion-icon name="close" class="text-2xl text-red-600"></ion-icon></button>
                    </div>
                </li>
            </ol>
            <div class="flex justify-between">
                <form id="continentForm" class="flex flex-col sm:flex-row gap-2 sm:gap-4">
                    <input id="continentInput" type="text" class="border border-blue-500 shadow-lg rounded-md px-3 py-2 w-full sm:w-auto" placeholder="Input a Continent...">
                    <button id="submitBtn" type="submit" class="bg-blue-500 shadow-lg shadow-blue-500/50 rounded-md px-3 py-2 text-white cursor-pointer w-full sm:w-auto">Submit</button>            
                </form>
            </div>
            
        </div>
    </div>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="script.js"></script>
</body>
</html>
